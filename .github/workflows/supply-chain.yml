name: supply-chain

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supply-chain:
    uses: leanish/supply-chain/.github/workflows/supply-chain.yml@3372b20f9353ad19874a72192dcbf5d443ed5d6e # v0.3.1-rc.1
    permissions:
      contents: read
    with:
      java-version: "25"
