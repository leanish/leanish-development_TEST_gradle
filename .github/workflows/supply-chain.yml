name: supply-chain

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: Rescan only this open PR now
        required: false
        type: string

permissions:
  contents: read

jobs:
  supply-chain:
    uses: leanish/supply-chain/.github/workflows/supply-chain.yml@87b1e9e5b54657f668bf9087b81441fb5eb251cc # carrier-first-security-fixes snapshot
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    with:
      java-version: "25"
