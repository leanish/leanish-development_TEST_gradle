name: supply-chain

on:
  pull_request:
    types: [ opened, synchronize, reopened, edited ]
  push:
    branches: [ main ]
  workflow_dispatch:

  schedule:
    - cron: 17 5 * * *
permissions:
  contents: read

jobs:
  supply-chain:
    uses: leanish/leanish-development/.github/workflows/supply-chain.yml@c2739ec90401ea9ff08168b9f00b349c7f91cc5e # v0.7.0-rc.1
    permissions:
      contents: read
    with:
      java-version: "25"
